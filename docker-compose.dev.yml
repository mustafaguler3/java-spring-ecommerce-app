services:
  redis:
    image: redis:7-alpine
    container_name: redis-dev
    ports:
      - "6379:6379"
    restart: always
  mysql:
    image: mysql:8
    container_name: mysql-dev
    restart: always
    env_file:
      - .env.dev
    ports:
      - "3307:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql

  backend:
    build: .
    container_name: app-dev
    depends_on:
      - mysql
    ports:
      - "8080:8080"
    env_file:
      - .env.dev
    environment:
      - SPRING_PROFILES_ACTIVE=dev

volumes:
  mysql_dev_data: