name: Java CI with Docker

on:
  push:
    branches: [ "develop", "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: ambassadors/setup-java@v3 # Veya temurin
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            mustafaguler4/spring-ecommerce-app:latest
            mustafaguler4/spring-ecommerce-app:${{ github.sha }}

  deploy-dev:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: SSH Deploy to Dev Server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          script: |
            cd /home/${{ secrets.DEV_SERVER_USER }}/app-folder 
            
            docker pull mustafaguler4/spring-ecommerce-app:${{ github.sha }}
            
            export IMAGE_TAG=${{ github.sha }}
            docker-compose -f docker-compose.dev.yml up -d